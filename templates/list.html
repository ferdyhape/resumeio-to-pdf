<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved Resumes</title>
    <link
      rel="stylesheet"
      href="./static/assets/vendor/tailwind/tailwind.min.css"
    />
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen py-16">
    <div class="w-full max-w-lg mx-auto px-3 sm:px-0">
      <div class="bg-white shadow-md rounded-lg p-6">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-semibold">Saved Resumes</h1>
        </div>

        <!-- Tabel List Resume yang sudah disimpan -->
        <div class="mt-6">
          <table class="w-full border-collapse border border-gray-300">
            <thead>
              <tr class="bg-gray-200">
                <th class="border border-gray-300 px-4 py-2 text-left">
                  File Name
                </th>
                <th class="border border-gray-300 px-4 py-2 text-center">
                  Action
                </th>
              </tr>
            </thead>
            <tbody>
              {% for resume in resumes %}
              <tr class="bg-white border-b border-gray-300">
                <td class="border border-gray-300 px-4 py-2">{{ resume }}</td>
                <td class="border border-gray-300 px-4 py-2 text-center">
                  <a
                    href="/download-local/{{ resume }}"
                    class="bg-green-500 hover:bg-green-700 text-white py-1 px-3 rounded-md"
                  >
                    Download
                  </a>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
